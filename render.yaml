services:
  # AO Executor (Node.js)
  - type: web
    name: ao-executor
    env: node
    buildCommand: npm install
    startCommand: node ao.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ao.js verwacht SUPABASE_SERVICE_ROLE_KEY (niet SUPABASE_KEY).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_ENGINE_URL
        value: https://ai-engine.onrender.com
      - key: BACKEND_URL
        value: https://sterkbouw-saas-back.onrender.com
      # ── Orchestrator (F2+F3) ─────────────────────────────────────────────
      # Activeert orchestrator-laag naast bestaande executor_tasks poller.
      # Orchestrator schrijft naar orlando-core-os Supabase (apart project van
      # de sterkbouw executor_tasks DB). Beide secrets in Render dashboard zetten.
      - key: ORCHESTRATOR_SUPABASE_URL
        sync: false
      - key: ORCHESTRATOR_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ORCHESTRATOR_ENABLED
        value: "true"
      - key: ORCHESTRATOR_WORKER_ID
        value: render-orch-1
      - key: ORCHESTRATOR_POLL_INTERVAL_MS
        value: "2000"
      - key: ORCHESTRATOR_HEARTBEAT_INTERVAL_MS
        value: "10000"
      - key: ORCHESTRATOR_WATCHDOG_INTERVAL_MS
        value: "30000"
      - key: ORCHESTRATOR_WORKER_TIMEOUT_S
        value: "60"
      - key: ORCHESTRATOR_MAX_CONCURRENCY
        value: "1"
      - key: ORCHESTRATOR_TASK_TIMEOUT_MS
        value: "900000"
      - key: ORCHESTRATOR_WORK_DIR
        value: /tmp/orchestrator
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Secret — handmatig in te vullen via Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      # YouTube Data API v3 key voor Viral Intelligence Engine scanner
      - key: YOUTUBE_API_KEY
        sync: false
      # Replicate API token voor Phase 2.5 render pipeline (text/image-to-video)
      - key: REPLICATE_API_TOKEN
        sync: false
    healthCheckPath: /ping
    autoDeploy: true

  # AI Engine (Python)
  - type: web
    name: ai-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: PORT
        value: 8000
      - key: AI_ENGINE_PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        value: redis://red-cv9n2uun6mpkrqk9tvm0:6379
    healthCheckPath: /health
    autoDeploy: true

  # Redis (voor AI Engine task queue)
  - type: redis
    name: sterkbouw-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru
